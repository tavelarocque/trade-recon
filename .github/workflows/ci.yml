name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test suite
        run: pytest -q

      - name: Recall and precision on 20 seeds
        run: python run.py --seeds 1-20

      - name: Planted bugs must all be caught
        run: python mutation_check.py

      - name: Full pipeline, report and Excel workbooks build
        run: |
          python run.py
          python excel_twin.py
